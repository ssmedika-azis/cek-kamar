<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Kesiapan Kamar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 14px; }
    .container { max-width: 500px; margin: 0 auto; background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { margin: 0 0 4px; color: var(--primary-dark); font-size: 20px; text-align: center; }
    p.subtitle { margin: 0 0 18px; text-align: center; font-size: 13px; color: #64748b; }
    .form-group { margin-bottom: 15px; }
    label.title { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    select, input[type="text"], textarea {
      width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; background: #fff;
    }
    .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .radio-card {
      border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 500;
    }
    .radio-card input { display: none; }
    .radio-card.active { background: #ccfbf1; border-color: var(--primary); color: var(--primary-dark); font-weight: 700; }
    .radio-card.danger.active { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
    .checkbox-list { display: flex; flex-direction: column; gap: 8px; }
    .checkbox-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px;
    }
    .checkbox-item input { width: 18px; height: 18px; accent-color: var(--primary); }
    .camera-box {
      border: 2px dashed var(--border); border-radius: 12px; padding: 14px; text-align: center; background: #f8fafc; cursor: pointer;
    }
    .camera-box img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; }
    button.btn-submit {
      width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }
    button.btn-submit:disabled { background: #94a3b8; }
    #loading { display: none; text-align: center; margin-top: 12px; font-size: 14px; color: var(--primary-dark); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <h2>🏥 Cek Kesiapan Kamar</h2>
  <p class="subtitle">Laporan Kondisi Ruangan Sebelum Pasien Masuk</p>

  <form id="roomForm">
    <div class="form-group">
      <label class="title">1. Nomor / Nama Kamar *</label>
      <select id="kamar" required>
        <option value="">-- Pilih Kamar --</option>
        <option value="VIP 01">VIP 01</option>
        <option value="VIP 02">VIP 02</option>
        <option value="Kelas 1 - 101">Kelas 1 - 101</option>
        <option value="Kelas 1 - 102">Kelas 1 - 102</option>
        <option value="Kelas 2 - 201">Kelas 2 - 201</option>
        <option value="Kelas 3 - 301">Kelas 3 - 301</option>
      </select>
    </div>

    <div class="form-group">
      <label class="title">2. Nama Petugas *</label>
      <input type="text" id="petugas" placeholder="Ketik nama petugas..." required>
    </div>

    <div class="form-group">
      <label class="title">3. Kondisi Aroma Ruangan *</label>
      <div class="radio-grid">
        <label class="radio-card active" onclick="selectRadio(this)">
          <input type="radio" name="aroma" value="Wangi / Segar" checked> ✨ Wangi / Segar
        </label>
        <label class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="aroma" value="Netral / Tidak Berbau"> 🍃 Netral
        </label>
        <label class="radio-card danger" onclick="selectRadio(this)">
          <input type="radio" name="aroma" value="Bau Amis"> ⚠️ Bau Amis
        </label>
        <label class="radio-card danger" onclick="selectRadio(this)">
          <input type="radio" name="aroma" value="Bau Apek / Lembap"> ⚠️ Bau Apek
        </label>
      </div>
    </div>

    <div class="form-group">
      <label class="title">4. Kondisi Toilet *</label>
      <div class="radio-grid">
        <label class="radio-card active" onclick="selectRadio(this)">
          <input type="radio" name="toilet" value="Bersih, Kering & Wangi" checked> ✅ Bersih & Kering
        </label>
        <label class="radio-card danger" onclick="selectRadio(this)">
          <input type="radio" name="toilet" value="Perlu Dibersihkan Ulang"> ❌ Perlu Dibersihkan
        </label>
      </div>
    </div>

    <div class="form-group">
      <label class="title">5. Kelengkapan Alat & Fasilitas</label>
      <div class="checkbox-list">
        <label class="checkbox-item"><input type="checkbox" name="alat" value="Bed & Linen Rapi" checked> Bed & Linen Bersih/Rapi</label>
        <label class="checkbox-item"><input type="checkbox" name="alat" value="AC Berfungsi" checked> AC Berfungsi Dingin</label>
        <label class="checkbox-item"><input type="checkbox" name="alat" value="Bel Pasien Aktif" checked> Bel Pasien Berfungsi</label>
        <label class="checkbox-item"><input type="checkbox" name="alat" value="Oksigen & Suction Siap" checked> Outlet Oksigen & Suction Siap</label>
        <label class="checkbox-item"><input type="checkbox" name="alat" value="Tempat Sampah Kosong" checked> Tempat Sampah Kosong</label>
      </div>
    </div>

    <div class="form-group">
      <label class="title">6. Foto Kondisi Toilet *</label>
      <div class="camera-box" onclick="document.getElementById('inputFotoToilet').click()">
        <span>📷 Tap untuk Ambil Foto Toilet</span>
        <input type="file" id="inputFotoToilet" accept="image/*" capture="environment" style="display:none" onchange="prosesGambar(this, 'previewToilet', 'toilet')">
        <img id="previewToilet">
      </div>
    </div>

    <div class="form-group">
      <label class="title">7. Foto Kondisi Keseluruhan Kamar *</label>
      <div class="camera-box" onclick="document.getElementById('inputFotoKamar').click()">
        <span>📷 Tap untuk Ambil Foto Kamar</span>
        <input type="file" id="inputFotoKamar" accept="image/*" capture="environment" style="display:none" onchange="prosesGambar(this, 'previewKamar', 'kamar')">
        <img id="previewKamar">
      </div>
    </div>

    <div class="form-group">
      <label class="title">8. Catatan Tambahan (Opsional)</label>
      <textarea id="catatan" rows="2" placeholder="Catatan kondisi ruangan..."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">Kirim Laporan Kesiapan</button>
    <div id="loading">⏳ Mengunggah foto & menyimpan data...</div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ymxpxrrjxnujygabrhsg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_AXcmTZqRh9W-Qs0yoEcUdQ_bxLpar50';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let blobToilet = null;
  let blobKamar = null;

  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const kamarParam = urlParams.get('kamar');
    if (kamarParam) document.getElementById('kamar').value = kamarParam;
  });

  function selectRadio(el) {
    const parent = el.parentElement;
    parent.querySelectorAll('.radio-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    el.querySelector('input').checked = true;
  }

  function prosesGambar(input, previewId, jenis) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleSize;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const previewEl = document.getElementById(previewId);
        previewEl.src = canvas.toDataURL('image/jpeg', 0.7);
        previewEl.style.display = 'inline-block';

        canvas.toBlob((blob) => {
          if (jenis === 'toilet') blobToilet = blob;
          if (jenis === 'kamar') blobKamar = blob;
        }, 'image/jpeg', 0.7);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('roomForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!blobToilet || !blobKamar) {
      alert('Harap ambil foto toilet dan foto kondisi kamar terlebih dahulu!');
      return;
    }

    const btn = document.getElementById('btnSubmit');
    const loading = document.getElementById('loading');
    btn.disabled = true;
    loading.style.display = 'block';

    try {
      const kamar = document.getElementById('kamar').value;
      const waktuId = Date.now();
      const namaFileToilet = `toilet_${kamar.replace(/\s+/g, '')}_${waktuId}.jpg`;
      const namaFileKamar = `kamar_${kamar.replace(/\s+/g, '')}_${waktuId}.jpg`;

      const { error: err1 } = await db.storage.from('foto-kamar').upload(namaFileToilet, blobToilet);
      if (err1) throw err1;
      const urlToilet = db.storage.from('foto-kamar').getPublicUrl(namaFileToilet).data.publicUrl;

      const { error: err2 } = await db.storage.from('foto-kamar').upload(namaFileKamar, blobKamar);
      if (err2) throw err2;
      const urlKamar = db.storage.from('foto-kamar').getPublicUrl(namaFileKamar).data.publicUrl;

      const alatChecked = Array.from(document.querySelectorAll('input[name="alat"]:checked')).map(cb => cb.value).join(', ');

      const { error: errDb } = await db.from('laporan_kamar').insert([{
        kamar: kamar,
        petugas: document.getElementById('petugas').value,
        aroma: document.querySelector('input[name="aroma"]:checked').value,
        toilet: document.querySelector('input[name="toilet"]:checked').value,
        alat: alatChecked,
        foto_toilet: urlToilet,
        foto_kamar: urlKamar,
        catatan: document.getElementById('catatan').value
      }]);

      if (errDb) throw errDb;

      alert('✅ Laporan kesiapan kamar berhasil disimpan!');
      document.getElementById('roomForm').reset();
      document.getElementById('previewToilet').style.display = 'none';
      document.getElementById('previewKamar').style.display = 'none';
      blobToilet = null;
      blobKamar = null;

    } catch (error) {
      alert('❌ Gagal menyimpan: ' + error.message);
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  });
</script>

</body>
</html>
