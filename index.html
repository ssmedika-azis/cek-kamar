<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Kesiapan Kamar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #f1f5f9; color: #1e293b; margin: 0; padding: 14px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    h2 { margin: 0 0 12px; color: #0f766e; font-size: 18px; }
    .fg { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 9px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; background: #0d9488; color: #fff; cursor: pointer; }
    .btn-sub { background: #e2e8f0; color: #1e293b; padding: 7px 12px; border-radius: 8px; text-decoration: none; font-size: 12.5px; font-weight: 600; }
    img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 6px; display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <strong style="color:#0f766e;">🏥 Cek Kesiapan Kamar</strong>
    <a href="rekap.html" class="btn-sub">📊 Dashboard</a>
  </div>

  <div class="card">
    <h2>📋 Input Laporan Kamar</h2>
    <div class="fg"><label>Nama Pemeriksa (Petugas / Manajemen)</label><input type="text" id="petugas" placeholder="Ketik nama lengkap Anda"></div>
    <div class="fg"><label>Kamar</label><select id="kamar"></select></div>
    <div class="fg"><label>Shift</label><select id="shift"></select></div>
    <div class="fg">
      <label>Kondisi Aroma</label>
      <select id="aroma">
        <option value="Wangi / Segar">Wangi / Segar</option>
        <option value="Netral / Tidak Berbau">Netral / Tidak Berbau</option>
        <option value="Bau Amis">Bau Amis</option>
        <option value="Bau Apek / Lembap">Bau Apek / Lembap</option>
      </select>
    </div>
    <div class="fg">
      <label>Kondisi Toilet</label>
      <select id="toilet">
        <option value="Bersih, Kering & Wangi">Bersih, Kering & Wangi</option>
        <option value="Perlu Dibersihkan Ulang">Perlu Dibersihkan Ulang</option>
      </select>
    </div>
    <div class="fg">
      <label>Kelengkapan</label>
      <div class="grid">
        <label><input type="checkbox" name="alat" value="Sprei Rapi" checked> Sprei Rapi</label>
        <label><input type="checkbox" name="alat" value="AC & Lampu" checked> AC & Lampu</label>
        <label><input type="checkbox" name="alat" value="TV & Remote" checked> TV & Remote</label>
        <label><input type="checkbox" name="alat" value="Bel Pasien" checked> Bel Pasien</label>
        <label><input type="checkbox" name="alat" value="Sabun & Tisu" checked> Sabun & Tisu</label>
        <label><input type="checkbox" name="alat" value="Tempat Sampah" checked> Tempat Sampah</label>
      </div>
    </div>
    <div class="fg">
      <label>Foto Toilet (Wajib)</label>
      <input type="file" id="fToilet" accept="image/*" capture="environment" onchange="prev(this,'p1')">
      <img id="p1">
    </div>
    <div class="fg">
      <label>Foto Kamar (Wajib)</label>
      <input type="file" id="fKamar" accept="image/*" capture="environment" onchange="prev(this,'p2')">
      <img id="p2">
    </div>
    <div class="fg"><label>Catatan</label><textarea id="catatan" rows="2" placeholder="Opsional..."></textarea></div>
    <button class="btn" id="btnKirim" onclick="kirim()">✅ Kirim Laporan</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ymxpxrrjxnujygabrhsg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_AXcmTZqRh9W-Qs0yoEcUdQ_bxLpar50';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  window.onload = async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      const { data: p } = await db.from('profil_pengguna').select('nama_lengkap').eq('user_id', session.user.id).single();
      if (p) document.getElementById('petugas').value = p.nama_lengkap;
    }
    const [rk, rs] = await Promise.all([
      db.from('daftar_kamar').select('nama_kamar').order('nama_kamar'),
      db.from('daftar_shift').select('nama_shift').order('id')
    ]);
    document.getElementById('kamar').innerHTML = (rk.data && rk.data.length)
      ? rk.data.map(x => `<option value="${x.nama_kamar}">${x.nama_kamar}</option>`).join('')
      : '<option value="VIP 01">VIP 01</option><option value="Kelas 1">Kelas 1</option>';
    document.getElementById('shift').innerHTML = (rs.data && rs.data.length)
      ? rs.data.map(x => `<option value="${x.nama_shift}">${x.nama_shift}</option>`).join('')
      : '<option value="Pagi">Pagi</option><option value="Siang">Siang</option><option value="Malam">Malam</option>';
  };

  function prev(inp, id) {
    if (inp.files[0]) {
      const img = document.getElementById(id);
      img.src = URL.createObjectURL(inp.files[0]);
      img.style.display = 'block';
    }
  }

  async function upFoto(file, tag) {
    const name = `${tag}_${Date.now()}.jpg`;
    const { error } = await db.storage.from('foto-kamar').upload(name, file);
    if (error) throw error;
    return db.storage.from('foto-kamar').getPublicUrl(name).data.publicUrl;
  }

  async function kirim() {
    const petugas = document.getElementById('petugas').value.trim();
    const f1 = document.getElementById('fToilet').files[0];
    const f2 = document.getElementById('fKamar').files[0];
    if (!petugas || !f1 || !f2) return alert('Isi nama pemeriksa serta foto toilet & kamar.');

    const btn = document.getElementById('btnKirim');
    btn.disabled = true; btn.textContent = '⏳ Menyimpan...';
    try {
      const [u1, u2] = await Promise.all([upFoto(f1, 'toilet'), upFoto(f2, 'kamar')]);
      const alat = Array.from(document.querySelectorAll('input[name="alat"]:checked')).map(e => e.value).join(', ');
      const { error } = await db.from('laporan_kamar').insert([{
        petugas,
        kamar: document.getElementById('kamar').value,
        shift: document.getElementById('shift').value,
        aroma: document.getElementById('aroma').value,
        toilet: document.getElementById('toilet').value,
        alat,
        catatan: document.getElementById('catatan').value.trim(),
        foto_toilet: u1,
        foto_kamar: u2
      }]);
      if (error) throw error;
      alert('✅ Laporan berhasil tersimpan!');
      location.reload();
    } catch (e) {
      alert('❌ Gagal: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = '✅ Kirim Laporan';
    }
  }
</script>
</body>
</html>
